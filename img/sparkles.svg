<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <defs>
    <linearGradient id="spGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5E6A3;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="spRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8D5E8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#C8A2C8;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Estrella grande central (4 puntas) -->
  <path d="M 150 80 L 158 138 L 220 150 L 158 162 L 150 220 L 142 162 L 80 150 L 142 138 Z"
        stroke="url(#spGold)" stroke-width="1.5" fill="none" opacity="0.8"/>

  <!-- Estrella mediana (4 puntas) -->
  <path d="M 60 60 L 65 88 L 95 95 L 65 102 L 60 130 L 55 102 L 25 95 L 55 88 Z"
        stroke="url(#spRose)" stroke-width="1.2" fill="none" opacity="0.7"/>

  <!-- Estrella mediana derecha -->
  <path d="M 240 40 L 244 62 L 268 68 L 244 74 L 240 96 L 236 74 L 212 68 L 236 62 Z"
        stroke="url(#spGold)" stroke-width="1.2" fill="none" opacity="0.7"/>

  <!-- Estrella pequeña -->
  <path d="M 80 230 L 83 248 L 102 252 L 83 256 L 80 274 L 77 256 L 58 252 L 77 248 Z"
        stroke="url(#spRose)" stroke-width="1" fill="none" opacity="0.6"/>

  <!-- Estrella pequeña derecha -->
  <path d="M 240 210 L 243 228 L 262 232 L 243 236 L 240 254 L 237 236 L 218 232 L 237 228 Z"
        stroke="url(#spGold)" stroke-width="1" fill="none" opacity="0.6"/>

  <!-- Cruz/destello simple grande -->
  <line x1="150" y1="60" x2="150" y2="240" stroke="url(#spGold)" stroke-width="0.8" opacity="0.3"/>
  <line x1="60" y1="150" x2="240" y2="150" stroke="url(#spGold)" stroke-width="0.8" opacity="0.3"/>

  <!-- Destellos pequeños dispersos -->
  <line x1="200" y1="100" x2="200" y2="115" stroke="url(#spRose)" stroke-width="1.5" opacity="0.6"/>
  <line x1="193" y1="107" x2="207" y2="107" stroke="url(#spRose)" stroke-width="1.5" opacity="0.6"/>

  <line x1="100" y1="190" x2="100" y2="202" stroke="url(#spGold)" stroke-width="1.5" opacity="0.6"/>
  <line x1="94" y1="196" x2="106" y2="196" stroke="url(#spGold)" stroke-width="1.5" opacity="0.6"/>

  <line x1="255" y1="155" x2="255" y2="165" stroke="url(#spRose)" stroke-width="1.2" opacity="0.5"/>
  <line x1="250" y1="160" x2="260" y2="160" stroke="url(#spRose)" stroke-width="1.2" opacity="0.5"/>

  <line x1="45" y1="155" x2="45" y2="165" stroke="url(#spGold)" stroke-width="1.2" opacity="0.5"/>
  <line x1="40" y1="160" x2="50" y2="160" stroke="url(#spGold)" stroke-width="1.2" opacity="0.5"/>

  <!-- Puntos brillantes -->
  <circle cx="175" cy="95" r="2.5" fill="#F5E6A3" opacity="0.7"/>
  <circle cx="125" cy="205" r="2" fill="#C8A2C8" opacity="0.7"/>
  <circle cx="210" cy="180" r="2" fill="#D4AF37" opacity="0.6"/>
  <circle cx="90" cy="120" r="2.5" fill="#E8D5E8" opacity="0.6"/>
  <circle cx="230" cy="130" r="1.5" fill="#F5E6A3" opacity="0.5"/>
  <circle cx="70" cy="190" r="1.5" fill="#D4AF37" opacity="0.5"/>
</svg>