<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <defs>
    <linearGradient id="tulipGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5E6A3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tulipRose" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8D5E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8A2C8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#C8A2C8;stop-opacity:0.6" />
    </linearGradient>
  </defs>

  <!-- === TULIPÁN IZQUIERDO (dorado) === -->
  <!-- Tallo -->
  <path d="M 90 400 Q 85 320 90 260" stroke="url(#stemGrad)" stroke-width="2" fill="none" opacity="0.7"/>
  <!-- Hoja izquierda -->
  <path d="M 88 320 Q 55 290 50 260 Q 75 275 88 300" stroke="url(#tulipGold)" stroke-width="1.5" fill="none" opacity="0.6"/>
  <!-- Hoja derecha -->
  <path d="M 92 300 Q 125 270 130 240 Q 105 260 92 285" stroke="url(#tulipGold)" stroke-width="1.5" fill="none" opacity="0.6"/>
  <!-- Flor - pétalos -->
  <path d="M 90 260 Q 70 230 75 200 Q 88 220 90 240" stroke="url(#tulipGold)" stroke-width="2" fill="none" opacity="0.85"/>
  <path d="M 90 260 Q 110 230 105 200 Q 92 220 90 240" stroke="url(#tulipGold)" stroke-width="2" fill="none" opacity="0.85"/>
  <path d="M 90 260 Q 65 245 62 215 Q 80 230 88 250" stroke="url(#tulipGold)" stroke-width="1.8" fill="none" opacity="0.7"/>
  <path d="M 90 260 Q 115 245 118 215 Q 100 230 92 250" stroke="url(#tulipGold)" stroke-width="1.8" fill="none" opacity="0.7"/>
  <path d="M 90 260 Q 90 225 90 200" stroke="url(#tulipGold)" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- === TULIPÁN CENTRAL (rosa) === -->
  <!-- Tallo -->
  <path d="M 250 400 Q 248 310 250 240" stroke="url(#stemGrad)" stroke-width="2.5" fill="none" opacity="0.8"/>
  <!-- Hoja izquierda -->
  <path d="M 248 330 Q 210 295 205 260 Q 235 278 248 308" stroke="url(#tulipRose)" stroke-width="1.8" fill="none" opacity="0.7"/>
  <!-- Hoja derecha -->
  <path d="M 252 305 Q 290 270 295 235 Q 265 255 252 282" stroke="url(#tulipRose)" stroke-width="1.8" fill="none" opacity="0.7"/>
  <!-- Flor - pétalos (más grande, central) -->
  <path d="M 250 240 Q 225 205 232 168 Q 248 192 250 222" stroke="url(#tulipRose)" stroke-width="2.2" fill="none" opacity="0.9"/>
  <path d="M 250 240 Q 275 205 268 168 Q 252 192 250 222" stroke="url(#tulipRose)" stroke-width="2.2" fill="none" opacity="0.9"/>
  <path d="M 250 240 Q 218 222 215 188 Q 238 205 248 228" stroke="url(#tulipRose)" stroke-width="2" fill="none" opacity="0.75"/>
  <path d="M 250 240 Q 282 222 285 188 Q 262 205 252 228" stroke="url(#tulipRose)" stroke-width="2" fill="none" opacity="0.75"/>
  <path d="M 250 240 Q 250 200 250 168" stroke="url(#tulipRose)" stroke-width="1.8" fill="none" opacity="0.6"/>
  <!-- Detalle interior -->
  <path d="M 242 220 Q 250 200 258 220" stroke="url(#tulipGold)" stroke-width="1.2" fill="none" opacity="0.5"/>

  <!-- === TULIPÁN DERECHO (dorado) === -->
  <!-- Tallo -->
  <path d="M 410 400 Q 415 320 410 260" stroke="url(#stemGrad)" stroke-width="2" fill="none" opacity="0.7"/>
  <!-- Hoja izquierda -->
  <path d="M 408 320 Q 375 290 370 260 Q 395 275 408 300" stroke="url(#tulipGold)" stroke-width="1.5" fill="none" opacity="0.6"/>
  <!-- Hoja derecha -->
  <path d="M 412 300 Q 445 270 450 240 Q 425 260 412 285" stroke="url(#tulipGold)" stroke-width="1.5" fill="none" opacity="0.6"/>
  <!-- Flor - pétalos -->
  <path d="M 410 260 Q 390 230 395 200 Q 408 220 410 240" stroke="url(#tulipGold)" stroke-width="2" fill="none" opacity="0.85"/>
  <path d="M 410 260 Q 430 230 425 200 Q 412 220 410 240" stroke="url(#tulipGold)" stroke-width="2" fill="none" opacity="0.85"/>
  <path d="M 410 260 Q 385 245 382 215 Q 400 230 408 250" stroke="url(#tulipGold)" stroke-width="1.8" fill="none" opacity="0.7"/>
  <path d="M 410 260 Q 435 245 438 215 Q 420 230 412 250" stroke="url(#tulipGold)" stroke-width="1.8" fill="none" opacity="0.7"/>

  <!-- === TULIPÁN PEQUEÑO IZQUIERDO === -->
  <path d="M 170 400 Q 168 350 170 305" stroke="url(#stemGrad)" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M 170 305 Q 155 280 160 258 Q 169 272 170 290" stroke="url(#tulipRose)" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 170 305 Q 185 280 180 258 Q 171 272 170 290" stroke="url(#tulipRose)" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 168 290 Q 158 272 162 252 Q 169 265 170 280" stroke="url(#tulipRose)" stroke-width="1.2" fill="none" opacity="0.5"/>
  <path d="M 172 290 Q 182 272 178 252 Q 171 265 170 280" stroke="url(#tulipRose)" stroke-width="1.2" fill="none" opacity="0.5"/>

  <!-- === TULIPÁN PEQUEÑO DERECHO === -->
  <path d="M 330 400 Q 332 350 330 305" stroke="url(#stemGrad)" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M 330 305 Q 315 280 320 258 Q 329 272 330 290" stroke="url(#tulipGold)" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 330 305 Q 345 280 340 258 Q 331 272 330 290" stroke="url(#tulipGold)" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M 328 290 Q 318 272 322 252 Q 329 265 330 280" stroke="url(#tulipGold)" stroke-width="1.2" fill="none" opacity="0.5"/>
  <path d="M 332 290 Q 342 272 338 252 Q 331 265 330 280" stroke="url(#tulipGold)" stroke-width="1.2" fill="none" opacity="0.5"/>

  <!-- Partículas flotantes -->
  <circle cx="60" cy="180" r="2" fill="#D4AF37" opacity="0.4"/>
  <circle cx="150" cy="150" r="1.5" fill="#C8A2C8" opacity="0.5"/>
  <circle cx="350" cy="140" r="2" fill="#D4AF37" opacity="0.4"/>
  <circle cx="440" cy="170" r="1.5" fill="#C8A2C8" opacity="0.5"/>
  <circle cx="200" cy="120" r="1" fill="#F5E6A3" opacity="0.6"/>
  <circle cx="300" cy="110" r="1" fill="#E8D5E8" opacity="0.6"/>
</svg>