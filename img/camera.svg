<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5E6A3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C8A2C8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8D5E8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Cuerpo principal de la cámara -->
  <rect x="60" y="90" width="280" height="170" rx="18" ry="18"
        stroke="url(#goldGrad)" stroke-width="2.5" fill="none" opacity="0.9"/>

  <!-- Parte superior (visor) -->
  <rect x="100" y="60" width="200" height="40" rx="10" ry="10"
        stroke="url(#goldGrad)" stroke-width="2" fill="none" opacity="0.8"/>

  <!-- Línea de unión superior -->
  <line x1="100" y1="90" x2="100" y2="100" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>
  <line x1="300" y1="90" x2="300" y2="100" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>

  <!-- Lente principal - círculos concéntricos -->
  <circle cx="200" cy="180" r="65" stroke="url(#goldGrad)" stroke-width="2.5" fill="none" opacity="0.9"/>
  <circle cx="200" cy="180" r="52" stroke="url(#roseGrad)" stroke-width="1.5" fill="none" opacity="0.7"/>
  <circle cx="200" cy="180" r="38" stroke="url(#goldGrad)" stroke-width="1.5" fill="none" opacity="0.6"/>
  <circle cx="200" cy="180" r="24" stroke="url(#roseGrad)" stroke-width="1" fill="none" opacity="0.5"/>
  <circle cx="200" cy="180" r="10" stroke="url(#goldGrad)" stroke-width="1" fill="none" opacity="0.4"/>

  <!-- Reflejo en lente -->
  <circle cx="183" cy="163" r="6" stroke="none" fill="white" opacity="0.15"/>
  <circle cx="178" cy="168" r="3" stroke="none" fill="white" opacity="0.1"/>

  <!-- Botón disparador -->
  <circle cx="310" cy="75" r="12" stroke="url(#goldGrad)" stroke-width="2" fill="none" opacity="0.8"/>
  <circle cx="310" cy="75" r="6" stroke="url(#roseGrad)" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Visor pequeño -->
  <rect x="115" y="68" width="35" height="22" rx="4"
        stroke="url(#roseGrad)" stroke-width="1.5" fill="none" opacity="0.7"/>

  <!-- Contador de fotogramas -->
  <rect x="245" y="68" width="40" height="22" rx="4"
        stroke="url(#goldGrad)" stroke-width="1.5" fill="none" opacity="0.7"/>
  <line x1="255" y1="79" x2="275" y2="79" stroke="url(#goldGrad)" stroke-width="1" opacity="0.5"/>

  <!-- Detalles laterales izquierda -->
  <rect x="60" y="130" width="15" height="50" rx="5"
        stroke="url(#goldGrad)" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Detalles laterales derecha -->
  <rect x="325" y="130" width="15" height="50" rx="5"
        stroke="url(#goldGrad)" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Tornillos decorativos -->
  <circle cx="85" cy="110" r="5" stroke="url(#goldGrad)" stroke-width="1.2" fill="none" opacity="0.5"/>
  <circle cx="315" cy="110" r="5" stroke="url(#goldGrad)" stroke-width="1.2" fill="none" opacity="0.5"/>
  <circle cx="85" cy="245" r="5" stroke="url(#goldGrad)" stroke-width="1.2" fill="none" opacity="0.5"/>
  <circle cx="315" cy="245" r="5" stroke="url(#goldGrad)" stroke-width="1.2" fill="none" opacity="0.5"/>

  <!-- Línea decorativa inferior -->
  <line x1="80" y1="235" x2="320" y2="235"
        stroke="url(#roseGrad)" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- Destellos alrededor -->
  <line x1="140" y1="30" x2="140" y2="50" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.5"/>
  <line x1="130" y1="40" x2="150" y2="40" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.5"/>
  <line x1="260" y1="25" x2="260" y2="42" stroke="url(#roseGrad)" stroke-width="1.2" opacity="0.4"/>
  <line x1="252" y1="33" x2="268" y2="33" stroke="url(#roseGrad)" stroke-width="1.2" opacity="0.4"/>
  <line x1="355" y1="155" x2="355" y2="168" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.4"/>
  <line x1="349" y1="162" x2="361" y2="162" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.4"/>
</svg>