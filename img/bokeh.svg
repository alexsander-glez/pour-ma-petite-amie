<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <radialGradient id="b1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="b2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#C8A2C8;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#C8A2C8;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="b3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#F5E6A3;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#F5E6A3;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="b4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#E8D5E8;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#E8D5E8;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Bokeh grande dorado -->
  <circle cx="120" cy="150" r="80" fill="url(#b1)"/>
  <circle cx="120" cy="150" r="80" stroke="#D4AF37" stroke-width="0.5" fill="none" opacity="0.2"/>

  <circle cx="680" cy="100" r="100" fill="url(#b1)"/>
  <circle cx="680" cy="100" r="100" stroke="#D4AF37" stroke-width="0.5" fill="none" opacity="0.15"/>

  <circle cx="400" cy="500" r="90" fill="url(#b1)"/>

  <!-- Bokeh mediano rosa -->
  <circle cx="250" cy="80" r="55" fill="url(#b2)"/>
  <circle cx="250" cy="80" r="55" stroke="#C8A2C8" stroke-width="0.5" fill="none" opacity="0.2"/>

  <circle cx="600" cy="400" r="70" fill="url(#b2)"/>
  <circle cx="600" cy="400" r="70" stroke="#C8A2C8" stroke-width="0.5" fill="none" opacity="0.15"/>

  <circle cx="100" cy="450" r="60" fill="url(#b2)"/>

  <!-- Bokeh pequeño crema -->
  <circle cx="500" cy="60" r="40" fill="url(#b3)"/>
  <circle cx="500" cy="60" r="40" stroke="#F5E6A3" stroke-width="0.5" fill="none" opacity="0.25"/>

  <circle cx="750" cy="350" r="45" fill="url(#b3)"/>
  <circle cx="200" cy="350" r="35" fill="url(#b3)"/>
  <circle cx="650" cy="520" r="50" fill="url(#b3)"/>

  <!-- Bokeh lila suave -->
  <circle cx="350" cy="200" r="65" fill="url(#b4)"/>
  <circle cx="50" cy="300" r="45" fill="url(#b4)"/>
  <circle cx="720" cy="250" r="55" fill="url(#b4)"/>

  <!-- Bokeh muy pequeños (puntos de luz) -->
  <circle cx="180" cy="250" r="15" fill="url(#b1)"/>
  <circle cx="420" cy="320" r="20" fill="url(#b2)"/>
  <circle cx="580" cy="180" r="18" fill="url(#b3)"/>
  <circle cx="300" cy="480" r="12" fill="url(#b4)"/>
  <circle cx="460" cy="420" r="16" fill="url(#b1)"/>
  <circle cx="80" cy="520" r="14" fill="url(#b2)"/>
  <circle cx="700" cy="480" r="18" fill="url(#b3)"/>

  <!-- Puntos brillantes muy pequeños -->
  <circle cx="320" cy="130" r="4" fill="#F5E6A3" opacity="0.4"/>
  <circle cx="550" cy="280" r="3" fill="#D4AF37" opacity="0.5"/>
  <circle cx="170" cy="380" r="4" fill="#C8A2C8" opacity="0.4"/>
  <circle cx="630" cy="320" r="3" fill="#E8D5E8" opacity="0.5"/>
  <circle cx="440" cy="150" r="3" fill="#D4AF37" opacity="0.4"/>
  <circle cx="760" cy="180" r="4" fill="#C8A2C8" opacity="0.4"/>
  <circle cx="30" cy="200" r="3" fill="#F5E6A3" opacity="0.3"/>
</svg>